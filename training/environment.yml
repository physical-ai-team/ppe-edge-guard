# 노트북(CPU)에서 export된 ONNX 모델을 검증하는 용도. 학습 자체는 Colab에서 수행.
name: ppe-training
channels:
  - conda-forge
dependencies:
  - python=3.11
  - onnxruntime>=1.17
  - onnx>=1.12,<2       # ultralytics ONNX export에 필요 (없으면 실행 중 pip로 자동 설치됨)
  - numpy>=1.26
  - pillow>=10
  - pyyaml>=6
  - matplotlib
  - pip
  - pip:
      - ultralytics>=8.2   # 결과 비교/시각화용 (CPU torch 설치됨)
