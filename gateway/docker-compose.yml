# 실행: cd gateway; Copy-Item .env.example .env (값 채우기); docker compose up -d --build
# 단독 테스트: .env에 INFERENCE_MODE=mock, SYNC_MODE=dry_run → docker compose up ingest cloud-sync
# inference(김정윤, 트랙 I1)는 해당 트랙에서 서비스 추가 예정
name: ppe-edge-guard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: ppe-edge-guard/ingest:dev
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "${INGEST_PORT:-8000}:8000"
    volumes:
      - gateway-data:/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/opt/conda/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *default-logging

  cloud-sync:
    build:
      context: .
      dockerfile: cloud-sync/Dockerfile
    image: ppe-edge-guard/cloud-sync:dev
    env_file: .env
    environment:
      DATA_DIR: /data
    # 포트는 외부에 열지 않는다 (/healthz는 컨테이너 헬스체크용). 업로드 현황은 ingest /api/v1/stats의 by_status로 본다
    volumes:
      - gateway-data:/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/opt/conda/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *default-logging

volumes:
  gateway-data:
