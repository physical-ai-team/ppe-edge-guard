# 실행: cd gateway; Copy-Item .env.example .env (값 채우기); docker compose up -d --build
# 단독 테스트: .env에 INFERENCE_MODE=mock → docker compose up ingest
# inference(김정윤, 트랙 I1)·cloud-sync(트랙 G2)는 각 트랙에서 서비스 추가 예정
name: ppe-edge-guard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    image: ppe-edge-guard/ingest:dev
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "${INGEST_PORT:-8000}:8000"
    volumes:
      - gateway-data:/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/opt/conda/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *default-logging

volumes:
  gateway-data:
